<!doctype html>
<!--
  ThunderRAG reply-drafting UI

  3-pane layout:
  - Left: scrollable list of emails to reply to (selected from TB message list)
  - Middle: per-email conversation with the LLM (email metadata+body at top, Q&A below)
  - Right: draft editor (LLM-written, user-editable) with Send button

  State per email:
  - "pending": not yet started — waiting for /reply/start
  - "no_reply": LLM decided no reply needed; user can override
  - "interviewing": Q&A in progress
  - "drafted": draft ready, editable
  - "sent": reply was sent, right pane frozen
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThunderRAG — Draft Replies</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        background: Canvas;
        color: CanvasText;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        display: flex;
        height: 100vh;
      }

      /* ── Left pane: email list ── */
      .left-pane {
        width: 260px;
        min-width: 200px;
        border-right: 1px solid rgba(127,127,127,0.25);
        display: flex;
        flex-direction: column;
        background: Canvas;
      }
      .left-pane h2 {
        margin: 0;
        padding: 12px 14px 8px;
        font-size: 13px;
        opacity: 0.7;
        font-weight: 600;
      }
      .email-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 6px 6px;
      }
      .email-item {
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 2px;
        border: 1px solid transparent;
        font-size: 13px;
        line-height: 1.3;
      }
      .email-item:hover {
        background: rgba(127,127,127,0.08);
      }
      .email-item.active {
        background: AccentColor;
        color: AccentColorText;
        border-color: rgba(0,0,0,0);
      }
      .email-item .ei-from {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .email-item .ei-subject {
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .email-item .ei-status {
        font-size: 11px;
        margin-top: 2px;
        opacity: 0.7;
      }
      .email-item.active .ei-status { opacity: 0.9; }

      /* Status badges */
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-pending { background: rgba(127,127,127,0.15); }
      .badge-interviewing { background: rgba(59,130,246,0.2); color: #2563eb; }
      .badge-no-reply { background: rgba(234,179,8,0.2); color: #a16207; }
      .badge-drafted { background: rgba(34,197,94,0.2); color: #15803d; }
      .badge-sent { background: rgba(99,102,241,0.2); color: #4338ca; }
      .email-item.active .badge { opacity: 0.9; }

      /* ── Middle pane: conversation ── */
      .mid-pane {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(127,127,127,0.25);
      }
      .mid-header {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        font-size: 12px;
        line-height: 1.4;
        max-height: 220px;
        overflow-y: auto;
        flex-shrink: 0;
      }
      .mid-header .mh-subject { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
      .mid-header .mh-meta { opacity: 0.75; }
      .mid-header .mh-body {
        margin-top: 8px;
        white-space: pre-wrap;
        font-size: 12px;
        opacity: 0.85;
        max-height: 120px;
        overflow-y: auto;
        border-top: 1px solid rgba(127,127,127,0.1);
        padding-top: 6px;
      }
      .mid-chat {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .mid-chat .msg {
        display: flex;
        margin: 6px 0;
      }
      .mid-chat .msg-assistant { justify-content: flex-start; }
      .mid-chat .msg-user { justify-content: flex-end; }
      .mid-chat .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 10px;
        line-height: 1.35;
        white-space: pre-wrap;
        border: 1px solid rgba(127,127,127,0.25);
        background: Field;
        color: FieldText;
        font-size: 13px;
      }
      .mid-chat .msg-user .bubble {
        background: AccentColor;
        color: AccentColorText;
        border-color: rgba(0,0,0,0);
      }
      .mid-composer {
        padding: 8px 14px;
        border-top: 1px solid rgba(127,127,127,0.25);
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .mid-composer textarea {
        flex: 1;
        font-size: 13px;
        padding: 6px 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 8px;
        resize: none;
        min-height: 36px;
        max-height: 100px;
        font-family: inherit;
      }
      .mid-composer button {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
      }
      .mid-composer button:hover { background: rgba(127,127,127,0.1); }

      /* No-reply override */
      .no-reply-banner {
        padding: 14px;
        text-align: center;
        font-size: 13px;
        opacity: 0.8;
      }
      .no-reply-banner button {
        margin-top: 8px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
      }

      /* ── Right pane: draft editor ── */
      .right-pane {
        width: 380px;
        min-width: 280px;
        display: flex;
        flex-direction: column;
        background: Canvas;
      }
      .right-header {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .right-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 14px;
      }
      .right-body textarea {
        flex: 1;
        font-size: 13px;
        padding: 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 8px;
        resize: none;
        font-family: inherit;
        line-height: 1.4;
      }
      .right-body textarea:disabled {
        opacity: 0.7;
        background: rgba(127,127,127,0.05);
      }
      .right-actions {
        padding: 8px 14px;
        border-top: 1px solid rgba(127,127,127,0.15);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      .right-actions button {
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
      }
      .right-actions button.primary {
        background: AccentColor;
        color: AccentColorText;
        border-color: AccentColor;
        font-weight: 600;
      }
      .right-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .sent-banner {
        padding: 14px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #15803d;
      }

      /* Typing indicator */
      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 18px;
        line-height: 1;
        opacity: 0.85;
      }
      .typing .dot {
        width: 5px; height: 5px;
        border-radius: 999px;
        background: currentColor;
        animation: dotPulse 1.2s infinite ease-in-out;
      }
      .typing .dot:nth-child(2) { animation-delay: 0.15s; }
      .typing .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-2px); }
      }

      .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.5;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="left-pane">
        <h2>Emails to reply to</h2>
        <div id="emailList" class="email-list"></div>
      </div>
      <div class="mid-pane" id="midPane">
        <div class="empty-state">Select an email on the left</div>
      </div>
      <div class="right-pane" id="rightPane">
        <div class="empty-state">Draft will appear here</div>
      </div>
    </div>
    <script src="reply.js"></script>
  </body>
</html>
