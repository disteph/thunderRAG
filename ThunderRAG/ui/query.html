<!doctype html>
<!--
  ThunderRAG query UI

  Layout overview
  - Top bar: connection settings and transient status/errors.
  - Chat area: alternating user/assistant bubbles.
    - Assistant bubbles contain a collapsible Sources block (rendered first) and the answer below it.
    - The Sources summary contains an inline progress bar used during evidence upload.
  - Composer: textarea + send button.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThunderRAG</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      label {
        font-size: 12px;
        color: CanvasText;
        opacity: 0.75;
      }
      input[type="text"], textarea, input[type="number"], select {
        font-size: 14px;
        padding: 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 8px;
      }
      input[type="text"] {
        min-width: 360px;
        flex: 1;
      }
      textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
      }
      button {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      .muted {
        color: CanvasText;
        opacity: 0.7;
        font-size: 12px;
      }
      .error {
        color: #b00020;
        white-space: pre-wrap;
      }
      .retrieval-warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffc107;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.25);
        background: Canvas;
      }
      .topbar .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .topbar .field.small input {
        width: 84px;
        min-width: 84px;
      }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }

      .msg {
        display: flex;
        margin: 10px 0;
      }
      .msg-user {
        justify-content: flex-end;
      }
      .msg-assistant {
        justify-content: flex-start;
      }
      .bubble {
        max-width: min(860px, 92%);
        padding: 12px 12px;
        border-radius: 12px;
        line-height: 1.35;
        white-space: pre-wrap;
        border: 1px solid rgba(127, 127, 127, 0.25);
        background: Field;
        color: FieldText;
      }
      .msg-user .bubble {
        background: AccentColor;
        color: AccentColorText;
        border-color: rgba(0, 0, 0, 0.0);
      }
      .assistant-meta {
        margin-top: 10px;
        display: grid;
        gap: 10px;
      }
      .sources {
        display: grid;
        gap: 10px;
      }
      .source {
        border: 1px solid rgba(127, 127, 127, 0.25);
        border-radius: 10px;
        padding: 10px;
        background: Canvas;
        color: CanvasText;
        cursor: pointer;
        overflow: hidden;
      }
      .source:hover {
        border-color: rgba(127, 127, 127, 0.5);
      }
      .source:focus {
        outline: 2px solid AccentColor;
        outline-offset: 2px;
      }
      .source.not-in-prompt {
        opacity: 0.45;
        border-style: dashed;
      }
      .source-header {
        display: flex;
        justify-content: space-between;
        gap: 6px 12px;
        align-items: baseline;
      }
      .source-header > div:first-child {
        flex: 1 1 0;
        min-width: 0;
      }
      .source-header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .source-tank-icon {
        cursor: pointer;
        font-size: 14px;
        opacity: 0.6;
        transition: opacity 0.15s;
      }
      .source-tank-icon:hover {
        opacity: 1;
      }
      .source-title {
        font-weight: 600;
      }
      .source-meta {
        display: grid;
        gap: 2px;
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.9;
      }
      .source-text {
        margin-top: 8px;
        white-space: pre-wrap;
        font-size: 13px;
        opacity: 0.95;
      }

      .citation {
        color: AccentColor;
        text-decoration: underline;
        cursor: pointer;
      }
      .llm-debug-icon {
        position: absolute;
        top: 2px;
        right: 4px;
        cursor: pointer;
        font-size: 12px;
        opacity: 0.3;
        transition: opacity 0.15s;
        user-select: none;
      }
      .llm-debug-icon:hover { opacity: 0.9; }

      .summary-progress {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        opacity: 0.9;
      }

      .summary-progress progress {
        width: 160px;
        height: 12px;
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 18px;
        line-height: 1;
        opacity: 0.85;
      }

      .typing .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        animation: dotPulse 1.2s infinite ease-in-out;
      }

      .typing .dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing .dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      .typing-phase {
        margin-left: 8px;
        font-size: 12px;
        opacity: 0.7;
        font-style: italic;
        white-space: nowrap;
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.2;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      details summary {
        cursor: pointer;
        user-select: none;
        opacity: 0.4;
        font-size: 10px;
      }
      details summary:hover {
        opacity: 0.7;
      }

      .retrieval-block {
        font-family: monospace;
        font-size: 10px;
        opacity: 0.7;
        padding: 3px 6px;
        margin: 2px 0;
        border-radius: 3px;
        word-break: break-word;
      }
      .retrieval-query {
        background: rgba(100, 149, 237, 0.12);
        font-style: italic;
      }
      .retrieval-where {
        background: rgba(255, 165, 0, 0.12);
      }
      .retrieval-order {
        background: rgba(144, 238, 144, 0.12);
      }

      .source-body-toggle {
        margin-top: 6px;
        font-size: 11px;
      }
      .source-body-toggle summary {
        cursor: pointer;
        user-select: none;
        opacity: 0.5;
        font-size: 11px;
      }
      .source-body-toggle summary:hover {
        opacity: 0.8;
      }
      .source-body-content {
        margin-top: 4px;
        white-space: pre-wrap;
        font-size: 12px;
        opacity: 0.9;
        max-height: 300px;
        overflow-y: auto;
        border-top: 1px solid rgba(127, 127, 127, 0.15);
        padding-top: 4px;
      }

      .cited-sources {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(127, 127, 127, 0.15);
      }

      .composer {
        padding: 12px 14px;
        border-top: 1px solid rgba(127, 127, 127, 0.25);
        background: Canvas;
      }
      .composer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
      }
      /* Voice buttons */
      .voice-mic-btn, .voice-speak-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 6px;
        border-radius: 6px;
        opacity: 0.6;
        transition: opacity 0.15s, background 0.15s;
      }
      .voice-mic-btn:hover, .voice-speak-btn:hover { opacity: 1; }
      .voice-mic-btn.recording {
        opacity: 1;
        color: #d00;
        animation: micPulse 1s infinite;
      }
      @keyframes micPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <div class="row">
          <div class="field small">
            <label for="topK">Number of sources</label>
            <input id="topK" type="number" min="1" max="50" value="20" />
          </div>

          <div class="field" style="min-width: 160px;">
            <label for="chatModel">Chat model</label>
            <select id="chatModel">
              <option value="">(loading…)</option>
            </select>
          </div>

          <div class="field" style="min-width: 160px;">
            <label for="rewriteModel">Query generation model</label>
            <select id="rewriteModel">
              <option value="">(loading…)</option>
            </select>
          </div>

          <div class="field" style="min-width: 160px;">
            <label for="summarizeModel">Summarization model</label>
            <select id="summarizeModel">
              <option value="">(loading…)</option>
            </select>
          </div>

          <span id="status" class="muted" style="display:none;"></span>
        </div>

        <div id="error" class="error" style="margin-top: 8px;"></div>
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer">
        <label for="question">Message</label>
        <textarea id="question" placeholder="Ask something about your email archive..." autofocus></textarea>
        <div class="composer-row">
          <span class="muted">Enter to send. Cmd+Enter to add a new line.</span>
          <button id="askBtn">Send</button>
        </div>
      </div>
    </div>

    <script src="voice.js"></script>
    <script src="query.js"></script>
  </body>
</html>
