<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ThunderRAG Options</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #282840;
      --text: #e0e0e8;
      --muted: #9090a8;
      --accent: #7c7cf0;
      --border: #3a3a54;
      --input-bg: #1a1a2a;
      --success: #5cb85c;
      --error: #d9534f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 32px;
      min-width: 480px;
      max-width: 640px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 20px; font-weight: 600; }
    h2 {
      font-size: 1.05rem; font-weight: 600; margin: 28px 0 12px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .field { margin-bottom: 14px; }
    .field-row { display: flex; align-items: center; gap: 10px; }
    label {
      display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 3px;
    }
    label.inline { display: inline; margin: 0; cursor: pointer; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; max-width: 420px;
      padding: 6px 8px; font-size: 0.9rem;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--input-bg); color: var(--text); outline: none;
    }
    input[type="number"] { width: 100px; max-width: 100px; }
    select { width: auto; min-width: 200px; max-width: 420px; cursor: pointer; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 50px; font-family: inherit; }
    input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .sticky-header {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg); padding: 0 0 10px;
      border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .sticky-header .info-block {
      margin-top: 0; margin-bottom: 8px; padding: 8px 12px;
      font-size: 0.78rem; line-height: 1.5;
    }
    .sticky-header .btn-bar { margin: 6px 0 2px; }
    .sticky-header .path-info { margin-top: 2px; }
    .status {
      padding: 4px 0 6px;
      font-size: 0.85rem; min-height: 1.4em;
    }
    .status.ok { color: var(--success); }
    .status.err { color: var(--error); }
    .info-block {
      margin-top: 24px; padding: 12px 14px; background: var(--surface);
      border-radius: 6px; font-size: 0.82rem; line-height: 1.6; color: var(--muted);
    }
    .info-block strong { color: var(--text); }
    .info-block code {
      background: var(--input-bg); padding: 1px 5px; border-radius: 3px;
      font-size: 0.8rem;
    }
    #settings-container.loading { opacity: 0.4; pointer-events: none; }
    .btn {
      padding: 7px 20px; font-size: 0.9rem; font-weight: 600;
      border: none; border-radius: 5px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn:disabled { opacity: 0.5; cursor: default; filter: none; }
    .btn-reset {
      padding: 7px 16px; font-size: 0.85rem; font-weight: 500;
      border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
      background: transparent; color: var(--muted);
    }
    .btn-reset:hover { border-color: var(--error); color: var(--error); }
    .btn-bar { margin: 18px 0 8px; display: flex; gap: 10px; align-items: center; }
    .path-info {
      font-size: 0.75rem; color: var(--muted); margin-top: 4px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .dirty-indicator { font-size: 0.8rem; color: var(--muted); }
    details.prompts-section { margin-top: 20px; }
    details.prompts-section > summary {
      cursor: pointer; font-size: 1.05rem; font-weight: 600;
      padding: 8px 0; list-style: none; user-select: none;
    }
    details.prompts-section > summary::before {
      content: "\25B6"; display: inline-block; margin-right: 8px;
      transition: transform 0.15s;
    }
    details.prompts-section[open] > summary::before { transform: rotate(90deg); }
    .prompt-field { margin-bottom: 16px; }
    .prompt-field label { font-size: 0.82rem; color: var(--muted); margin-bottom: 2px; }
    .prompt-field textarea {
      width: 100%; min-height: 80px; font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem; line-height: 1.45; padding: 8px; resize: vertical;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h1>ThunderRAG Settings</h1>

  <!-- Sticky toolbar: status + endpoints + save/reset -->
  <div class="sticky-header" id="sticky-header">
    <div class="status" id="status"></div>

    <div class="info-block">
      <strong>Filter endpoints</strong><br>
      <strong>Ingest:</strong> <code id="endpointIngest">http://localhost:8080/ingest</code><br>
      <strong>Mark processed:</strong> <code id="endpointMarkProcessed">http://localhost:8080/admin/mark_processed</code>
    </div>

    <div class="btn-bar" id="settings-btn-bar" style="display:none;">
      <button class="btn" id="saveSettingsBtn">Save settings</button>
      <button class="btn-reset" id="resetSettingsBtn">Reset to defaults</button>
      <span class="dirty-indicator" id="settingsDirty"></span>
    </div>
    <div class="path-info" id="settingsPathInfo"></div>
  </div>

  <!-- Server URL — stored locally, needed to reach server -->
  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input id="serverUrl" type="text" placeholder="http://localhost:8080" />
    <div class="hint">Base URL of the ThunderRAG OCaml server.</div>
  </div>

  <!-- Dynamic settings from server -->
  <div id="settings-container" class="loading">
    <div style="color:var(--muted); font-size:0.9rem; padding:20px 0;">Loading settings from server…</div>
  </div>

  <!-- Collapsible prompts section -->
  <details class="prompts-section" id="prompts-section">
    <summary>Prompts</summary>
    <div id="prompts-container" style="color:var(--muted); font-size:0.9rem; padding:10px 0;">
      Click to load prompts from the server…
    </div>
    <div class="btn-bar" id="prompts-btn-bar" style="display:none;">
      <button class="btn" id="savePromptsBtn">Save prompts</button>
      <button class="btn-reset" id="resetPromptsBtn">Reset to defaults</button>
      <span class="dirty-indicator" id="promptsDirty"></span>
    </div>
    <div class="path-info" id="promptsPathInfo"></div>
  </details>


  <script src="options.js"></script>
</body>
</html>
