<!doctype html>
<!--
  ThunderRAG unified task manager + conversation UI

  3-pane layout:
  - Left: "General chat" (always present) + scrollable list of tasks
  - Middle: RAG conversation (General chat) or per-task LLM conversation
  - Right: compose form (To/Cc/Bcc/Subject/Body) populated by LLM via [DRAFT] markers

  Entry points:
  - tasks.html                     — opens with General chat selected
  - tasks.html?task_id=<id>        — open specific task
  - tasks.html?email_ids=[...]     — tasks referencing specific emails
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThunderRAG</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        background: Canvas;
        color: CanvasText;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        display: flex;
        height: 100vh;
      }

      /* ── Left pane: task list ── */
      .left-pane {
        width: 280px;
        min-width: 160px;
        border-right: none;
        display: flex;
        flex-direction: column;
        background: Canvas;
        flex-shrink: 0;
      }
      .left-toolbar {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
      }
      .left-toolbar h2 {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
        font-weight: 600;
        flex: 1;
        cursor: pointer;
        user-select: none;
      }
      .left-toolbar h2:hover { opacity: 1; }
      .left-toolbar .nav-btn {
        font-size: 11px;
        padding: 0 8px;
        height: 34px;
        border-radius: 4px;
        border: 1px solid rgba(127,127,127,0.25);
        background: Field;
        color: FieldText;
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
      }
      .left-toolbar .nav-btn:hover { background: rgba(127,127,127,0.1); }
      .left-toolbar .nav-btn.active {
        background: AccentColor;
        color: AccentColorText;
        border-color: AccentColor;
      }
      .pause-btn {
        font-size: 10px;
        padding: 0 7px;
        height: 34px;
        min-width: 42px;
        border-radius: 4px;
        border: 1px solid rgba(127,127,127,0.25);
        background: Field;
        color: FieldText;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.15s, background 0.15s, border-color 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
      }
      .pause-btn:hover { opacity: 1; }
      .pause-btn .pause-label { font-weight: 600; }
      .pause-btn .pause-sub { font-size: 9px; opacity: 0.85; }
      .pause-btn.paused {
        background: color-mix(in srgb, orange 25%, Canvas);
        border-color: color-mix(in srgb, orange 50%, transparent);
        color: color-mix(in srgb, orange 60%, CanvasText);
        opacity: 1;
      }
      .left-toolbar select {
        font-size: 11px;
        padding: 2px 4px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.3);
        border-radius: 4px;
      }
      .left-models {
        padding: 4px 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(127,127,127,0.1);
      }
      .left-models .model-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .left-models .model-label {
        font-size: 9px;
        font-weight: 600;
        opacity: 0.55;
        width: 52px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .left-models select {
        flex: 1;
        min-width: 0;
        font-size: 10px;
        padding: 2px 3px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.25);
        border-radius: 4px;
      }
      .nav-row {
        display: flex;
        gap: 0;
        flex-shrink: 0;
      }
      .nav-row .task-item {
        flex: 1;
        min-width: 0;
      }
      /* ── FYI pane ── */
      .fyi-list {
        list-style: disc;
        margin: 0;
        padding: 0 14px 0 28px;
        overflow-y: auto;
        flex: 1;
      }
      .fyi-list li {
        position: relative;
        padding: 10px 170px 10px 6px;
        font-size: 13px;
        line-height: 1.45;
        border-bottom: 1px solid rgba(127,127,127,0.1);
        cursor: pointer;
      }
      .fyi-list li:hover {
        background: rgba(127,127,127,0.06);
      }
      .fyi-list li.selected {
        background: color-mix(in srgb, AccentColor 16%, Canvas);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, AccentColor 42%, transparent);
      }
      .fyi-summary {
        margin-right: 8px;
      }
      .fyi-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fyi-date {
        font-size: 10px;
        opacity: 0.5;
        margin-left: 6px;
        white-space: nowrap;
      }
      .fyi-create-btn,
      .fyi-process-btn {
        font-size: 11px;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        padding: 4px 8px;
        color: #f5f5f5;
        font-weight: 600;
      }
      .fyi-create-btn {
        background: color-mix(in srgb, AccentColor 82%, black);
        border-color: color-mix(in srgb, AccentColor 60%, white 8%);
        color: AccentColorText;
      }
      .fyi-process-btn {
        background: rgba(255,255,255,0.16);
        border-color: rgba(255,255,255,0.26);
      }
      .fyi-create-btn:hover,
      .fyi-process-btn:hover {
        filter: brightness(1.08);
      }
      .fyi-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 8px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(127,127,127,0.15);
      }
      .fyi-toolbar h3 {
        margin: 0;
        font-size: 14px;
        flex: 1;
      }
      .fyi-toolbar button {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127,127,127,0.25);
        background: Field;
        color: FieldText;
        cursor: pointer;
      }
      .fyi-toolbar button:hover { background: rgba(127,127,127,0.1); }
      .fyi-count {
        font-size: 11px;
        opacity: 0.5;
      }
      .left-tasks-header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px 4px;
        flex-shrink: 0;
      }
      .left-tasks-header .lth-label {
        font-size: 11px;
        font-weight: 600;
        opacity: 0.6;
        flex: 1;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .status-filters {
        display: flex;
        gap: 6px;
        padding: 2px 10px 4px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .status-filters label {
        font-size: 10px;
        opacity: 0.75;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .status-filters input[type="checkbox"] {
        margin: 0;
        width: 12px;
        height: 12px;
      }
      .left-tasks-header select {
        font-size: 10px;
        padding: 1px 3px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.25);
        border-radius: 4px;
      }
      .task-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 6px 6px;
      }
      .task-item {
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 2px;
        border: 1px solid transparent;
        font-size: 13px;
        line-height: 1.3;
      }
      .task-item:hover {
        background: rgba(127,127,127,0.08);
      }
      .task-item.dragging {
        opacity: 0.4;
      }
      .task-item.drop-above {
        border-top: 2px solid AccentColor;
      }
      .task-item.drop-below {
        border-bottom: 2px solid AccentColor;
      }
      .task-item[draggable="true"] {
        cursor: grab;
      }
      .task-item[draggable="true"]:active {
        cursor: grabbing;
      }
      .task-item.selected {
        background: color-mix(in srgb, AccentColor 15%, Canvas);
        border-color: color-mix(in srgb, AccentColor 40%, transparent);
      }
      .task-item.active {
        background: AccentColor;
        color: AccentColorText;
        border-color: rgba(0,0,0,0);
      }
      .task-item .ti-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .task-item .ti-desc {
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }
      .task-item .ti-meta {
        font-size: 11px;
        margin-top: 2px;
        opacity: 0.7;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .task-item .ti-meta-left {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .task-item .ti-score {
        margin-left: auto;
        font-weight: 600;
        font-size: 10px;
        opacity: 0.8;
        white-space: nowrap;
      }
      .task-item.active .ti-meta { opacity: 0.9; }

      /* Status badges */
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-open { background: color-mix(in srgb, AccentColor 20%, Canvas); color: color-mix(in srgb, AccentColor 60%, CanvasText); }
      .badge-in_progress { background: color-mix(in srgb, CanvasText 12%, Canvas); color: CanvasText; opacity: 0.8; }
      .badge-done { background: color-mix(in srgb, CanvasText 12%, Canvas); color: CanvasText; opacity: 0.6; }
      .badge-dismissed { background: color-mix(in srgb, CanvasText 10%, Canvas); color: CanvasText; opacity: 0.45; }
      .task-item.active .badge { opacity: 0.9; color: AccentColorText; }

      .readiness-pip {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .readiness-pip.ready-yes { background: color-mix(in srgb, #22c55e 75%, CanvasText); }
      .readiness-pip.ready-no  { background: color-mix(in srgb, CanvasText 30%, Canvas); }

      /* ── Pane resize handles ── */
      .pane-divider {
        width: 5px;
        cursor: col-resize;
        background: rgba(127,127,127,0.15);
        flex-shrink: 0;
        position: relative;
        z-index: 10;
        transition: background 0.15s;
      }
      .pane-divider:hover,
      .pane-divider.active {
        background: AccentColor;
      }
      body.resizing-cols {
        cursor: col-resize !important;
        user-select: none;
      }
      .resize-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 9999;
        cursor: col-resize;
      }

      /* ── Middle pane: conversation ── */
      .mid-pane {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        border-right: none;
      }
      .mid-header {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        font-size: 12px;
        line-height: 1.4;
        flex-shrink: 0;
        position: relative;
      }
      .mid-header .mh-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; text-align: left; display: flex; align-items: baseline; gap: 8px; }
      .mid-header .mh-title-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mid-header .mh-title-meta { font-size: 11px; font-weight: 400; opacity: 0.7; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
      .mid-header .mh-desc { opacity: 0.85; margin-bottom: 6px; }
      .mid-header .mh-emails {
        font-size: 11px;
        opacity: 0.7;
        border-top: 1px solid rgba(127,127,127,0.1);
        padding-top: 6px;
      }
      .mid-header .mh-emails a {
        color: LinkText;
        text-decoration: none;
        cursor: pointer;
      }
      .mid-header .mh-emails a:hover { text-decoration: underline; }
      .mid-header .mh-actions {
        margin-top: 6px;
        display: flex;
        gap: 6px;
      }
      .mid-header .mh-actions button {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127,127,127,0.3);
        background: Field;
        color: FieldText;
        cursor: pointer;
      }
      .mid-header .mh-actions button:hover { background: rgba(127,127,127,0.1); }
      .mid-header .mh-actions button.danger { color: color-mix(in srgb, red 70%, CanvasText); border-color: color-mix(in srgb, red 30%, transparent); }

      .context-banner {
        padding: 8px 14px;
        background: color-mix(in srgb, orange 12%, Canvas);
        border-bottom: 1px solid color-mix(in srgb, orange 25%, transparent);
        font-size: 13px;
        color: inherit;
        text-align: center;
      }

      .mid-chat {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .mid-chat .msg {
        display: flex;
        margin: 6px 0;
      }
      .mid-chat .msg-assistant { justify-content: flex-start; }
      .mid-chat .msg-user { justify-content: flex-end; }
      .mid-chat .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 10px;
        line-height: 1.35;
        border: 1px solid rgba(127,127,127,0.25);
        background: Field;
        color: FieldText;
        font-size: 13px;
      }
      .mid-chat .msg-user .bubble {
        background: AccentColor;
        color: AccentColorText;
        border-color: rgba(0,0,0,0);
        white-space: pre-wrap;
      }
      /* Markdown content in assistant bubbles */
      .mid-chat .msg-assistant .bubble p { margin: 0 0 0.5em 0; }
      .mid-chat .msg-assistant .bubble p:last-child { margin-bottom: 0; }
      .mid-chat .msg-assistant .bubble ul, .mid-chat .msg-assistant .bubble ol { margin: 0.3em 0; padding-left: 1.4em; }
      .mid-chat .msg-assistant .bubble li { margin: 0.15em 0; }
      .mid-chat .msg-assistant .bubble code { background: rgba(127,127,127,0.12); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
      .mid-chat .msg-assistant .bubble pre { background: rgba(127,127,127,0.1); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 0.4em 0; }
      .mid-chat .msg-assistant .bubble pre code { background: none; padding: 0; }
      .mid-chat .msg-assistant .bubble blockquote { border-left: 3px solid rgba(127,127,127,0.3); margin: 0.4em 0; padding-left: 10px; opacity: 0.85; }
      .mid-chat .msg-assistant .bubble h1, .mid-chat .msg-assistant .bubble h2, .mid-chat .msg-assistant .bubble h3 { font-size: 13px; font-weight: 600; margin: 0.5em 0 0.3em; }
      .mid-chat .msg-assistant .bubble hr { border: none; border-top: 1px solid rgba(127,127,127,0.2); margin: 0.5em 0; }
      .llm-debug-icon {
        position: absolute;
        top: 2px;
        right: 4px;
        cursor: pointer;
        font-size: 12px;
        opacity: 0.3;
        transition: opacity 0.15s;
        user-select: none;
      }
      .llm-debug-icon:hover { opacity: 0.9; }
      .mid-composer {
        padding: 8px 14px;
        border-top: 1px solid rgba(127,127,127,0.25);
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .mid-composer textarea {
        flex: 1;
        font-size: 13px;
        padding: 6px 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 8px;
        resize: none;
        min-height: 36px;
        max-height: 100px;
        font-family: inherit;
      }
      .mid-composer button {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
      }
      .mid-composer button:hover { background: rgba(127,127,127,0.1); }

      /* ── Right pane: compose form ── */
      .right-pane {
        width: 400px;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        background: Canvas;
        flex-shrink: 0;
      }
      .right-header {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .right-header .draft-tabs {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      .right-header .draft-tab {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid rgba(127,127,127,0.3);
        background: Field;
        color: FieldText;
        font-weight: 400;
      }
      .right-header .draft-tab.active {
        background: AccentColor;
        color: AccentColorText;
        border-color: AccentColor;
        font-weight: 600;
      }
      .compose-fields {
        padding: 8px 14px 0;
        flex-shrink: 0;
      }
      .compose-fields .cf-row {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .compose-fields .cf-label {
        width: 50px;
        font-weight: 600;
        opacity: 0.7;
        flex-shrink: 0;
      }
      .compose-fields input {
        flex: 1;
        font-size: 12px;
        padding: 4px 6px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.25);
        border-radius: 4px;
        font-family: inherit;
      }
      .compose-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 8px 14px;
      }
      .compose-body textarea {
        flex: 1;
        font-size: 13px;
        padding: 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 8px;
        resize: none;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        line-height: 1.4;
      }
      .compose-body textarea:disabled {
        opacity: 0.7;
        background: rgba(127,127,127,0.05);
      }
      .right-actions {
        padding: 8px 14px;
        border-top: 1px solid rgba(127,127,127,0.15);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      .right-actions button {
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
      }
      .right-actions button.primary {
        background: AccentColor;
        color: AccentColorText;
        border-color: AccentColor;
        font-weight: 600;
      }
      .right-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Typing indicator */
      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 18px;
        line-height: 1;
        opacity: 0.85;
      }
      .typing .dot {
        width: 5px; height: 5px;
        border-radius: 999px;
        background: currentColor;
        animation: dotPulse 1.2s infinite ease-in-out;
      }
      .typing .dot:nth-child(2) { animation-delay: 0.15s; }
      .typing .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-2px); }
      }

      .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.5;
        font-size: 13px;
      }

      /* Email trigger rows */
      .mh-email-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 2px;
        line-height: 1.4;
      }
      .mh-email-row .email-link {
        flex: 1;
        min-width: 0;
        color: AccentColor;
        text-decoration: none;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mh-email-row .email-link:hover { text-decoration: underline; }
      .email-date {
        flex-shrink: 0;
        font-family: "SF Mono", "Menlo", "Consolas", monospace;
        font-size: 10px;
        opacity: 0.55;
        white-space: nowrap;
        padding: 0 4px;
      }
      .email-tank-icon {
        cursor: pointer;
        font-size: 12px;
        opacity: 0.5;
        flex-shrink: 0;
        transition: opacity 0.15s;
      }
      .email-tank-icon:hover { opacity: 1; }
      /* Task context menu (right-click) */
      .task-context-menu {
        position: fixed;
        z-index: 9999;
        min-width: 140px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        padding: 4px 0;
        font-size: 13px;
      }
      .task-context-menu .ctx-item {
        padding: 6px 14px;
        cursor: pointer;
      }
      .task-context-menu .ctx-item:hover {
        background: rgba(127,127,127,0.12);
      }
      .task-context-menu .ctx-item.danger {
        color: color-mix(in srgb, red 70%, CanvasText);
      }
      .task-context-menu .ctx-sep {
        height: 1px;
        margin: 4px 8px;
        background: rgba(127,127,127,0.25);
      }

      /* Collapsible email sections */
      .mh-email-section {
        margin-top: 4px;
      }
      .mh-email-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        user-select: none;
        padding: 3px 0;
      }
      .mh-email-toggle:hover { opacity: 1; }
      .mh-email-toggle .triangle {
        display: inline-block;
        font-size: 8px;
        transition: transform 0.15s;
      }
      .mh-email-toggle .triangle.open {
        transform: rotate(90deg);
      }
      .mh-email-section-body {
        display: none;
        padding-left: 2px;
      }
      .mh-email-section-body.open {
        display: block;
      }

      .email-hover-popup {
        position: fixed;
        z-index: 9999;
        min-width: 380px;
        max-width: 520px;
        max-height: 420px;
        overflow-y: auto;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.35);
        background: Field;
        color: FieldText;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        box-shadow: 0 6px 24px rgba(0,0,0,0.22);
        pointer-events: auto;
      }

      /* ── Memory management ── */
      .memory-list { padding: 10px 14px; overflow-y: auto; flex: 1; }
      .memory-card {
        border: 1px solid rgba(127,127,127,0.25);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: Field;
        font-size: 13px;
        line-height: 1.4;
      }
      .memory-card.disabled { opacity: 0.5; }
      .memory-card .mc-text { margin-bottom: 6px; white-space: pre-wrap; }
      .memory-card .mc-meta {
        font-size: 11px;
        opacity: 0.65;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .memory-card .mc-actions {
        margin-top: 6px;
        display: flex;
        gap: 6px;
      }
      .memory-card .mc-actions button {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127,127,127,0.3);
        background: Field;
        color: FieldText;
        cursor: pointer;
      }
      .memory-card .mc-actions button:hover { background: rgba(127,127,127,0.1); }
      .memory-card .mc-actions button.danger { color: color-mix(in srgb, red 70%, CanvasText); }
      .memory-card .mc-rule {
        margin-top: 6px;
        padding: 6px 8px;
        background: rgba(127,127,127,0.06);
        border-radius: 4px;
        font-size: 11px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .memory-toolbar {
        padding: 8px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .memory-toolbar h3 { margin: 0; font-size: 14px; flex: 1; }
      .memory-toolbar button {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(127,127,127,0.3);
        background: Field;
        color: FieldText;
        cursor: pointer;
      }
      .memory-toolbar button:hover { background: rgba(127,127,127,0.1); }
      .memory-create-form {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(127,127,127,0.15);
        flex-shrink: 0;
      }
      .memory-create-form textarea {
        width: 100%;
        font-size: 13px;
        padding: 6px 8px;
        background: Field;
        color: FieldText;
        border: 1px solid rgba(127,127,127,0.35);
        border-radius: 6px;
        resize: vertical;
        min-height: 50px;
        font-family: inherit;
        line-height: 1.4;
      }
      .memory-create-form .mcf-actions {
        margin-top: 6px;
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .memory-create-form .mcf-actions button {
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid rgba(127,127,127,0.3);
        background: Field;
        color: FieldText;
        cursor: pointer;
      }
      .memory-create-form .mcf-actions button.primary {
        background: AccentColor;
        color: AccentColorText;
        border-color: AccentColor;
        font-weight: 600;
      }
      /* Voice buttons */
      .voice-mic-btn, .voice-speak-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 6px;
        border-radius: 6px;
        opacity: 0.6;
        transition: opacity 0.15s, background 0.15s;
      }
      .voice-speak-btn {
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 12px;
        padding: 2px 4px;
        opacity: 0.3;
      }
      .voice-mic-btn:hover, .voice-speak-btn:hover { opacity: 1; }
      .voice-mic-btn.recording {
        opacity: 1;
        color: #d00;
        animation: micPulse 1s infinite;
      }
      @keyframes micPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .voice-autoplay-btn {
        background: none;
        border: 1px solid rgba(127,127,127,0.3);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 8px;
        border-radius: 6px;
        opacity: 0.6;
        transition: opacity 0.15s;
      }
      .voice-autoplay-btn:hover { opacity: 1; }
      .voice-autoplay-btn.active {
        opacity: 1;
        border-color: AccentColor;
        background: rgba(100,100,255,0.1);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="left-pane">
        <div class="left-toolbar">
          <h2 id="titleLink" title="DB Stats">ThunderRAG</h2>
          <button class="nav-btn" id="memoriesBtn" title="Memories">🧠 Memories</button>
          <button class="pause-btn" id="pauseTasksBtn" title="Pause/resume task daemon (triage, context, first message)"><span class="pause-label">Tasks</span><span class="pause-sub">on</span></button>
          <button class="pause-btn" id="pauseIngestBtn" title="Pause/resume async ingestion daemon"><span class="pause-label">Ingest</span><span class="pause-sub">on</span></button>
        </div>
        <div class="left-models">
          <div class="model-row"><span class="model-label">Chat</span><select id="chatModel" title="Chat model"><option>(loading…)</option></select></div>
          <div class="model-row"><span class="model-label">Rewrite</span><select id="rewriteModel" title="Query generation model"><option>(loading…)</option></select></div>
          <div class="model-row"><span class="model-label">Summary</span><select id="summarizeModel" title="Summarization model"><option>(loading…)</option></select></div>
        </div>
        <div class="nav-row">
          <div id="generalChatItem" class="task-item active" data-id="general">
            <div class="ti-title">💬 General chat</div>
          </div>
          <div id="fyiItem" class="task-item" data-id="fyi">
            <div class="ti-title">📋 FYI</div>
          </div>
        </div>
        <div class="left-tasks-header">
          <span class="lth-label">Tasks</span>
          <select id="sortBy">
            <option value="updated_at">Recent</option>
            <option value="manual">Manual</option>
            <option value="deadline">Deadline</option>
            <option value="importance">Importance</option>
          </select>
        </div>
        <div class="status-filters">
          <label><input type="checkbox" class="status-cb" value="open" checked> Open</label>
          <label><input type="checkbox" class="status-cb" value="in_progress" checked> In prog</label>
          <label><input type="checkbox" class="status-cb" value="done"> Done</label>
          <label><input type="checkbox" class="status-cb" value="dismissed"> Dismissed</label>
        </div>
        <div id="taskList" class="task-list"></div>
      </div>
      <div class="pane-divider" id="dividerLeft"></div>
      <div class="mid-pane" id="midPane">
        <div class="empty-state">Loading…</div>
      </div>
      <div class="pane-divider" id="dividerRight"></div>
      <div class="right-pane" id="rightPane">
        <div class="empty-state">Compose form will appear here</div>
      </div>
    </div>
    <script src="marked.min.js"></script>
    <script src="voice.js"></script>
    <script src="tasks.js"></script>
  </body>
</html>
